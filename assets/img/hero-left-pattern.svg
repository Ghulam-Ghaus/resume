<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 800" width="80" height="800" preserveAspectRatio="none" fill="none">
  <defs>
    <pattern id="islamicLattice" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Outer 8-point geometric star pattern lines -->
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" stroke="#c59b27" stroke-width="0.75" stroke-opacity="0.22" fill="none"/>
      <path d="M 0 0 L 40 40 M 40 0 L 0 40" stroke="#c59b27" stroke-width="0.5" stroke-opacity="0.15" fill="none"/>
      <rect x="10" y="10" width="20" height="20" stroke="#c59b27" stroke-width="0.7" stroke-opacity="0.18" fill="none"/>
      <circle cx="20" cy="20" r="4" stroke="#c59b27" stroke-width="0.6" stroke-opacity="0.25" fill="none"/>
    </pattern>
    <linearGradient id="fadeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="patternMask">
      <rect x="0" y="0" width="80" height="800" fill="url(#fadeEdge)"/>
    </mask>
  </defs>

  <!-- Repeated lattice with edge fade -->
  <rect x="0" y="0" width="80" height="800" fill="url(#islamicLattice)" mask="url(#patternMask)"/>
  
  <!-- Subtle vertical border accent -->
  <line x1="79" y1="0" x2="79" y2="800" stroke="#c59b27" stroke-width="0.5" stroke-opacity="0.12"/>
</svg>
